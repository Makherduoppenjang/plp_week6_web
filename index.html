<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpendWise Budget Tracker</h1>
            <p>Manage your expenses and stay on top of your budget!</p>
        </header>

        <!-- Dashboard Summary -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-amount">$0.00</p>
            </div>
            <div class="card">
                <h3>Budget Status</h3>
                <p id="budget-feedback">Enter your expenses below.</p>
            </div>
        </section>

        <!-- Expense Input Form -->
        <section class="form-section">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name:</label>
                    <input type="text" id="expense-name" required placeholder="e.g., Groceries">
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount ($):</label>
                    <input type="number" id="expense-amount" step="0.01" required placeholder="e.g., 50.00">
                </div>
                <button type="submit" id="add-btn">Add Expense</button>
            </form>
        </section>

        <!-- Expense List -->
        <section class="list-section">
            <h2>Expense Records</h2>
            <ul id="expense-list">
                <!-- Dynamically populated via JavaScript -->
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
